<!DOCTYPE html>
<html>
<head>
    <title>Secret Key Setup</title>
</head>
<body>
    <h2>Enter this secret key in Google Authenticator</h2>

    <h3>{{ secret_key }}</h3>

    <form action="/verify_setup_otp" method="POST">
        <br>
        <label>Enter OTP from Authenticator:</label><br>
        <input type="text" name="otp" required>
        <button type="submit">Verify</button>
    </form>
</body>
</html>
