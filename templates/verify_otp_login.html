<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Login — Enter OTP</title>
  <style>
    body { font-family: Arial, sans-serif; max-width:480px; margin:40px auto; }
    .card { border:1px solid #eee; padding:20px; border-radius:8px; }
    .btn { padding:10px 16px; border:none; background:#1976d2; color:white; border-radius:6px; cursor:pointer; }
    .error { color:#b00020; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Enter Login OTP</h2>

    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST" action="/verify_otp_login">
      <label>Enter the 6-digit code from your authenticator app</label><br>
      <input type="text" name="otp" required pattern="\d{6}" placeholder="123456" style="padding:8px; width:150px; margin-top:8px;"><br><br>
      <button type="submit" class="btn">Verify & Login</button>
    </form>

    <p style="margin-top:12px;"><a href="/login">Back to login</a></p>
  </div>
</body>
</html>
