<!DOCTYPE html>
<html>

    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 500px;

            border-radius: 8px;

<body>
    <div class="card">
        <h2>✅ MFA Enabled Successfully</h2>
        <p>Your authenticator app is now linked to: <b>{{ email }}</b></p>
